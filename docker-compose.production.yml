services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
      MEILISEARCH_URL: ${MEILISEARCH_URL}
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started
    ports:
      - "5000:5000"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adventureconnect}
      POSTGRES_USER: ${POSTGRES_USER:-adventureconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - adventureconnect_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.15
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY}
    volumes:
      - adventureconnect_meili:/meili_data

volumes:
  adventureconnect_postgres:
  adventureconnect_meili:
