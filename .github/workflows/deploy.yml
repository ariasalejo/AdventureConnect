name: AdventureConnect Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: adventureconnect-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test --if-present
      - run: npm run build
      - name: Build production image
        run: docker build -t adventureconnect:\${{ github.sha }} .
      - name: Export verified image
        run: docker save adventureconnect:\${{ github.sha }} | gzip > adventureconnect-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: adventureconnect-production-image
          path: adventureconnect-image.tar.gz
          retention-days: 7

  deploy:
    needs: build
    if: \${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Deployment provider not configured
        run: |
          echo "Production deployment is intentionally gated."
          echo "Configure the target host/provider and secrets before enabling this job."
